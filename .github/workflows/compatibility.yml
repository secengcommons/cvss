name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '15 14 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOWORK: off

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build Compatibility Matrix
        id: matrix
        shell: bash
        run: |
          matrix=$(go -C tools run ./cimatrix compatibility ..)
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"

  test:
    name: Go ${{ matrix.version }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go ${{ matrix.version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.version }}
          cache: false
      - name: Test Root Module
        run: go test -count=1 -shuffle=on ./...
      - name: Test Go 1.25 Modules
        if: ${{ !startsWith(matrix.version, '1.24.') }}
        shell: bash
        run: |
          go -C differential test -count=1 -shuffle=on ./...
          go -C tools test -count=1 -shuffle=on ./cimatrix
