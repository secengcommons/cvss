name: Fuzzing

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: fuzzing-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOWORK: off
  FUZZTIME: ${{ github.event_name == 'schedule' && '60s' || '100000x' }}
  FUZZ_PARALLEL: 4

jobs:
  root:
    name: Root
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Fuzz Root Module
        run: bash ./.github/scripts/verify.sh fuzz-root

  differential:
    name: Differential
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
          cache-dependency-path: differential/go.sum
      - name: Fuzz Differential Module
        run: bash ./.github/scripts/verify.sh fuzz-differential
